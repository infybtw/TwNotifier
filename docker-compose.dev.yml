services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  twn:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        API_PATH: ${API_PATH:-/api/v1}
        NUXT_PUBLIC_API_BASE: ${API_PATH:-/api/v1}
        NUXT_PUBLIC_BOT_USERNAME: ${NUXT_PUBLIC_BOT_USERNAME:-}
    env_file: .env
    depends_on:
      - twn

  caddy:
    image: caddy
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./CaddyfileDev:/etc/caddy/Caddyfile:ro
    depends_on:
      - twn
      - web

volumes:
  pgdata:
