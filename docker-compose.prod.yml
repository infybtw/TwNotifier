services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-twn}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twn -d twn"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pg

  twn:
    image: ghcr.io/infybtw/twnotifier
    build:
      context: .
      dockerfile: app/Dockerfile
      network: host
    env_file: .env
    restart: unless-stopped
    networks:
      - pg
    volumes:
      - ./logs/prod:/app/logs
    ports:
      - "${HTTP_SERVER_PORT:-3000}:${HTTP_SERVER_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/infybtw/twnotifier-web
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        API_PATH: ${API_PATH:-/api/v1}
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-}
        NUXT_PUBLIC_BOT_USERNAME: ${NUXT_PUBLIC_BOT_USERNAME:-}
    env_file: .env
    restart: unless-stopped
    ports:
      - "${WEB_SERVER_PORT:-3001}:${WEB_SERVER_PORT:-3001}"

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - pg

  pgbackweb:
    image: eduardolat/pgbackweb:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      PBW_ENCRYPTION_KEY: "key"
      PBW_POSTGRES_CONN_STRING: ${DATABASE_URL}
      PBW_PATH_PREFIX: "/pgback"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pg

volumes:
  pgdata-prod:

networks:
  pg:
    driver: bridge
