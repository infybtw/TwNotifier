# Production stack.
#
# Everything configurable is read from `.env` (see `.env.example`). Compose
# interpolates `${...}` from the `.env` file next to this file, and the
# containers receive it via `env_file`. In production Ansible renders `.env`
# from `deploy/ansible/vault.yaml` (see deploy/ansible).
#
# Images are pulled from GHCR; nothing is built here. Build them with the
# `docker-build.yml` workflow (git tag push) or locally with the dev stack.
#
# `TWN_VERSION` pins the image tag to a release. The Ansible deploy resolves the
# latest git tag and writes it to `.env`; when unset (bare `docker compose up`
# on a checkout without that variable) the images fall back to `latest`.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DATABASE:-twn}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pg

  twn:
    image: ghcr.io/infybtw/twnotifier:${TWN_VERSION:-latest}
    env_file: .env
    restart: unless-stopped
    networks:
      - pg
    volumes:
      - ./logs/prod:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/infybtw/twnotifier-web:${TWN_VERSION:-latest}
    restart: unless-stopped
    environment:
      WEB_SERVER_PORT: ${WEB_SERVER_PORT:-3001}

  # Sole public entry point; routes are managed in the Cloudflare dashboard.
  # No inbound host ports: Cloudflare terminates HTTPS and the connector makes
  # outbound connections. Both networks are needed to reach all origins.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN to the Cloudflare Tunnel token}
    networks:
      - pg
      - default
    depends_on:
      - twn
      - web
      - dbx

  dbx:
    image: t8y2/dbx:latest
    restart: unless-stopped
    # Cloudflare forwards /dbx and /dbx/* unchanged to http://dbx:4224.
    # Protect this path with Cloudflare Access; no host port is published.
    environment:
      DBX_PUBLIC_BASE_PATH: /dbx
    volumes:
      - dbx-data:/app/data
    networks:
      - pg
    depends_on:
      postgres:
        condition: service_healthy

  # Postgres backups to S3 (no UI). The whole environment comes from .env
  # (same file as `twn`), including POSTGRES_* and S3_* credentials.
  backup:
    image: ghcr.io/infybtw/postgres-backup
    env_file: .env
    networks:
      - pg
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata-prod:
  dbx-data:

networks:
  pg:
    driver: bridge
