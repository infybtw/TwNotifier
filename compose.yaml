# Production stack.
#
# Everything configurable is read from `.env` (see `.env.example`). Compose
# interpolates `${...}` from the `.env` file next to this file, and the `twn`
# container additionally receives `.env` via `env_file`.
#
# Images are pulled from GHCR; nothing is built here. Build them with the
# `docker-build.yml` workflow (git tag push) or locally with the dev stack.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DATABASE:-twn}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pg

  twn:
    image: ghcr.io/infybtw/twnotifier
    env_file: .env
    restart: unless-stopped
    networks:
      - pg
    volumes:
      - ./logs/prod:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/infybtw/twnotifier-web
    restart: unless-stopped
    environment:
      WEB_SERVER_PORT: ${WEB_SERVER_PORT:-3001}

  # Единая точка входа: принимает трафик либо напрямую из интернета,
  # либо от внешнего Caddy (TLS-терминация там), и раскидывает по контейнерам.
  # twn/web порты наружу не публикуют — всё идёт через edge_proxy, поэтому
  # rate-limit по IP в app (X-Forwarded-For/X-Real-IP) видит реальный IP.
  # Состоит в обеих сетях: twn живёт в `pg`, web — в `default`.
  edge_proxy:
    image: caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - pg
      - default
    depends_on:
      - twn
      - web

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    networks:
      - pg

  # Postgres backups to S3 (no UI). The whole environment comes from .env
  # (same file as `twn`): S3_* credentials are pulled from Doppler via
  # DOPPLER_TOKEN at container start, POSTGRES_* always come from this file
  # and take precedence over Doppler values.
  backup:
    image: ghcr.io/infybtw/postgres-backup
    env_file: .env
    networks:
      - pg
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata-prod:
  caddy-data:
  caddy-config:

networks:
  pg:
    driver: bridge
