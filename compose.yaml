# Production stack.
#
# Everything configurable is read from `.env` (see `.env.example`). Compose
# interpolates `${...}` from the `.env` file next to this file, and the `twn`
# container additionally receives `.env` via `env_file`.
#
# Images are pulled from GHCR; nothing is built here. Build them with the
# `docker-build.yml` workflow (git tag push) or locally with the dev stack.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DATABASE:-twn}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pg

  twn:
    image: ghcr.io/infybtw/twnotifier
    env_file: .env
    restart: unless-stopped
    networks:
      - pg
    volumes:
      - ./logs/prod:/app/logs
    ports:
      - "127.0.0.1:${HTTP_SERVER_PORT:-3000}:${HTTP_SERVER_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/infybtw/twnotifier-web
    restart: unless-stopped
    environment:
      WEB_SERVER_PORT: ${WEB_SERVER_PORT:-3001}
    ports:
      - "${WEB_SERVER_PORT:-3001}:${WEB_SERVER_PORT:-3001}"

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    networks:
      - pg

  # Postgres backups to S3 (no UI). The whole environment comes from .env
  # (same file as `twn`): S3_* credentials are pulled from Doppler via
  # DOPPLER_TOKEN at container start, POSTGRES_* always come from this file
  # and take precedence over Doppler values.
  backup:
    image: ghcr.io/infybtw/postgres-backup
    env_file: .env
    networks:
      - pg
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata-prod:

networks:
  pg:
    driver: bridge
