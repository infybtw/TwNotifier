name: Build and Push Images

on:
  push:
    branches: [main]
    tags:
      - '*'
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: infybtw/twnotifier
  WEB_IMAGE_NAME: infybtw/twnotifier-web
  TEMP_TAG: ghcr.io/infybtw/twnotifier:build
  WEB_TEMP_TAG: ghcr.io/infybtw/twnotifier-web:build

jobs:
  check-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Backend install, typecheck and test
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test

  check-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Frontend install, typecheck and build
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run generate

  build-backend:
    needs: check-backend
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./app/Dockerfile
          push: false
          load: true
          tags: ${{ env.TEMP_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save backend image
        run: docker save ${{ env.TEMP_TAG }} > /tmp/twn.tar

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v5
        with:
          name: docker-twn
          path: /tmp/twn.tar

  build-web:
    needs: check-web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          push: false
          load: true
          tags: ${{ env.WEB_TEMP_TAG }}
          build-args: |
            API_PATH=${{ vars.API_PATH || '/api/v1' }}
            NUXT_PUBLIC_API_BASE=${{ vars.NUXT_PUBLIC_API_BASE }}
            NUXT_PUBLIC_BOT_USERNAME=${{ vars.NUXT_PUBLIC_BOT_USERNAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save web image
        run: docker save ${{ env.WEB_TEMP_TAG }} > /tmp/twn-web.tar

      - name: Upload web image artifact
        uses: actions/upload-artifact@v5
        with:
          name: docker-twn-web
          path: /tmp/twn-web.tar

  push-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download backend image artifact
        uses: actions/download-artifact@v5
        with:
          name: docker-twn
          path: /tmp

      - name: Load backend image
        run: docker load < /tmp/twn.tar

      - name: Extract backend metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Tag and push backend image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag ${{ env.TEMP_TAG }} "$tag"
            docker push "$tag"
          done

  push-web:
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download web image artifact
        uses: actions/download-artifact@v5
        with:
          name: docker-twn-web
          path: /tmp

      - name: Load web image
        run: docker load < /tmp/twn-web.tar

      - name: Extract web metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Tag and push web image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag ${{ env.WEB_TEMP_TAG }} "$tag"
            docker push "$tag"
          done
