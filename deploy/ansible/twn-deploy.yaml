---
- import_playbook: playbooks/docker-setup.yaml

- import_playbook: playbooks/twn-setup.yaml

- name: twn deploy
  hosts: all
  vars_files:
  - vault.yaml
  tasks:
    - name: render .env from vault
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/.env.j2"
        dest: "{{ ansible_facts['user_dir'] }}/twn/.env"
        mode: "0600"

    - name: Start Docker Compose services
      community.docker.docker_compose_v2:
        project_src: ~/twn
        state: present
        pull: always
