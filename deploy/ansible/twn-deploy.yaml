---
- import_playbook: playbooks/docker-setup.yaml

- import_playbook: playbooks/twn-setup.yaml

- name: twn deploy
  hosts: all
  vars_files:
    - "{{ playbook_dir }}/vault.yaml"
  tasks:
    - name: require a Cloudflare Tunnel token
      ansible.builtin.assert:
        that:
          - (TUNNEL_TOKEN | default('') | trim | length) > 0
        fail_msg: "Set TUNNEL_TOKEN in vault.yaml before deploying."
        quiet: true

    - name: fetch release tags
      ansible.builtin.command:
        cmd: >-
          git -C {{ ansible_facts['user_dir'] }}/twn
          fetch --tags --force --quiet origin
      changed_when: false
      check_mode: false

    - name: list release tags
      ansible.builtin.command:
        cmd: >-
          git -C {{ ansible_facts['user_dir'] }}/twn
          tag --sort=-creatordate
      register: twn_tags
      changed_when: false
      check_mode: false

    - name: pick the latest release tag
      ansible.builtin.set_fact:
        twn_version: "{{ twn_tags.stdout_lines | first | default('latest', true) }}"

    - name: show the version being deployed
      ansible.builtin.debug:
        msg: "Deploying TWN images tagged {{ twn_version }}"

    - name: render .env from vault
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/.env.j2"
        dest: "{{ ansible_facts['user_dir'] }}/twn/.env"
        mode: "0600"

    - name: Start Docker Compose services
      community.docker.docker_compose_v2:
        project_src: ~/twn
        state: present
        pull: always
        # Remove the old edge_proxy container so it no longer exposes port 80.
        remove_orphans: true
