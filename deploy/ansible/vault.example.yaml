---
# Ansible Vault example: every secret and deployment value of the TWN stack.
# Copy to vault.yaml, fill real values, then encrypt:
#   cp vault.example.yaml vault.yaml
#   $EDITOR vault.yaml
#   ansible-vault encrypt vault.yaml
#
# The deploy play renders .env from templates/.env.j2 with these values, and
# the containers read everything from that file. No external secret manager is
# involved at runtime.

# --- Telegram bot ---
BOT_TOKEN: ""
BOT_USER_ID: ""
BOT_URL: ""
BOT_USERNAME: ""
DEFAULT_LANGUAGE: "ru"

# --- Twitch API / EventSub ---
CLIENT_ID: ""
CLIENT_SECRET: ""
# EventSub transport: "conduit" (WebSocket) or "webhook".
TWITCH_EVENT_TRANSPORT: "conduit"
# Required only when TWITCH_EVENT_TRANSPORT is "webhook".
TWITCH_WEBHOOK_SECRET: ""
TWITCH_WS: "wss://eventsub.wss.twitch.tv/ws"
TWITCH_HELIX: "https://api.twitch.tv"
TWITCH_OAUTH: "https://id.twitch.tv"
SHARD_COUNT: 1

# --- Kick API / webhooks ---
KICK_CLIENT_ID: ""
KICK_CLIENT_SECRET: ""
KICK_API: "https://api.kick.com"
KICK_OAUTH: "https://id.kick.com"

# --- Telegram Mini App / REST API ---
WEB_APP_URL: ""
ADMINER_URL: ""
API_PATH: "/api/v1"
API_RATE_LIMIT_PER_MINUTE: 60
SESSION_TTL_SECONDS: 3600
INIT_DATA_MAX_AGE_SECONDS: 300
INIT_DATA_FUTURE_SKEW_SECONDS: 30
INIT_DATA_MAX_BYTES: 8192
CORS_ORIGINS: "http://localhost:3001"

# --- PostgreSQL credentials; DATABASE_URL is built from these, do not set it ---
POSTGRES_USER: "infydev"
POSTGRES_PASSWORD: "infy.dev"
POSTGRES_DATABASE: "twn"
# Compose: service name and internal port. Local host process: localhost and 54322.
POSTGRES_HOST: "postgres"
POSTGRES_PORT: 5432

# --- Compose ports (read by compose.yaml from .env) ---
HTTP_SERVER_PORT: 3000
WEB_SERVER_PORT: 3001
# Host port of the edge_proxy (the container always listens on :80).
# The external Caddy should reverse_proxy to 127.0.0.1:<port>.
EDGE_HTTP_PORT: 80

# --- Image tag (optional) ---
# Leave unset: the deploy play resolves the latest git tag and uses it.
# Set it to pin a specific release, e.g. TWN_VERSION: "3.1.1".
# TWN_VERSION: ""

# --- Postgres backups (ghcr.io/infybtw/postgres-backup, no UI, dumps to S3) ---
# Cron schedule, e.g. "0 2 * * *" = every day at 02:00. Empty = single backup
# on container start.
BACKUP_SCHEDULE: "0 2 * * *"
S3_ACCESS_KEY_ID: ""
S3_SECRET_ACCESS_KEY: ""
S3_BUCKET: ""
S3_PREFIX: ""
S3_REGION: ""
S3_ENDPOINT: ""
