---
# Ansible Vault example.
# Copy to vault.yaml and fill real values, then encrypt:
#   cp vault.example.yaml vault.yaml
#   ansible-vault encrypt vault.yaml
#
# All backend secrets live in Doppler (see /.env.example.raw): the `twn`
# entrypoint runs `doppler run` at container start and injects them on top of
# .env. This vault only holds the Doppler bootstrap token and the values
# Compose reads directly from .env (see /.env.example).

# --- Doppler bootstrap (backend pulls secrets at runtime) ---
DOPPLER_TOKEN: ""

# --- PostgreSQL credentials; DATABASE_URL is built from these, do not set it ---
POSTGRES_USER: "infydev"
POSTGRES_PASSWORD: "infy.dev"
POSTGRES_DATABASE: "twn"
# Compose: service name and internal port. Local host process: localhost and 54322.
POSTGRES_HOST: "postgres"
POSTGRES_PORT: 5432

# --- Compose ports (read by compose.yaml from .env) ---
HTTP_SERVER_PORT: 3000
WEB_SERVER_PORT: 3001

# --- Postgres backups (ghcr.io/infybtw/postgres-backup, no UI, dumps to S3) ---
# Cron schedule, e.g. "0 2 * * *" = every day at 02:00. Empty = single backup
# on container start. S3_* credentials live in Doppler (.env.example.raw).
BACKUP_SCHEDULE: "0 2 * * *"
